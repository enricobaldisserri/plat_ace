services:
  ace-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ace-app:latest
    container_name: ace-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:password123@host.docker.internal:5432/ace
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

# Note: This configuration assumes Postgres is running on the host machine (via Docker Desktop)
# accessible via host.docker.internal.
